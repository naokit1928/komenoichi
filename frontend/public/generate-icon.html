<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ロゴ生成</title>
</head>
<body style="background:#f4f1ed; text-align:center; padding:60px; font-family:sans-serif;">

<h2 style="color:#4b3e2a;">こめのいち アイコン生成（テスト：大きめ・色反転）</h2>

<canvas id="canvas" width="512" height="512" style="max-width:200px; margin:20px; border-radius:24px; box-shadow:0 8px 24px rgba(0,0,0,0.15);"></canvas>
<br>
<button onclick="dl()" style="background:#C62828; color:white; border:none; padding:14px 28px; border-radius:10px; font-size:15px; cursor:pointer; margin:8px;">
  icon.png をダウンロード
</button>

<script>
// 色反転（白背景・赤とんぼ）＋ scale(1.0) 最大サイズ
const svg = `<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="white"/>
  <g transform="translate(50,50) scale(1.0) translate(-50,-50)">
    <path d="M50 49 C44 43,30 37,16 41 C8 44,7 53,16 55 C26 57,44 52,50 51Z" fill="#C62828" opacity="0.9"/>
    <path d="M50 49 C56 43,70 37,84 41 C92 44,93 53,84 55 C74 57,56 52,50 51Z" fill="#C62828" opacity="0.9"/>
    <path d="M50 53 C44 51,28 51,16 58 C10 62,12 69,20 69 C30 69,44 61,50 56Z" fill="#C62828" opacity="0.65"/>
    <path d="M50 53 C56 51,72 51,84 58 C90 62,88 69,80 69 C70 69,56 61,50 56Z" fill="#C62828" opacity="0.65"/>
    <path d="M50 33 C49 39,49 71,50 83" stroke="#C62828" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="29" r="7" fill="#C62828"/>
  </g>
</svg>`;

window.onload = () => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => { ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url); };
  img.src = url;
};

function dl() {
  const canvas = document.getElementById('canvas');
  const a = document.createElement('a');
  a.download = 'icon.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
