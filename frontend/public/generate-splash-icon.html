<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スプラッシュ画面用アイコン生成</title>
</head>
<body style="background: #f4f1ed; text-align: center; padding: 60px; font-family: sans-serif;">
  <h2 style="color: #4b3e2a;">スプラッシュ画面用アイコン（余白たっぷり）</h2>
  <canvas id="canvas" width="512" height="512" style="border: 1px solid #ccc; max-width: 256px;"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // 白背景で塗りつぶす（これが余白になります）
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 512, 512);

    // 中央に配置する小さめの赤とんぼ（200x200サイズ）
    const logoSize = 200;
    const offsetX = (512 - logoSize) / 2; // 中央に寄せる
    const offsetY = (512 - logoSize) / 2; // 中央に寄せる

    const svgString = `<svg width="${logoSize}" height="${logoSize}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 46 C44 40,30 34,16 38 C8 41,7 50,16 52 C26 54,44 49,50 48Z" fill="#8B3A2A" opacity="0.9"/>
      <path d="M50 46 C56 40,70 34,84 38 C92 41,93 50,84 52 C74 54,56 49,50 48Z" fill="#8B3A2A" opacity="0.9"/>
      <path d="M50 50 C44 48,28 48,16 55 C10 59,12 66,20 66 C30 66,44 58,50 53Z" fill="#8B3A2A" opacity="0.65"/>
      <path d="M50 50 C56 48,72 48,84 55 C90 59,88 66,80 66 C70 66,56 58,50 53Z" fill="#8B3A2A" opacity="0.65"/>
      <path d="M50 26 C49 32,49 64,50 76" stroke="#8B3A2A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="50" cy="22" r="7" fill="#8B3A2A"/>
    </svg>`;

    const img = new Image();
    const svgBlob = new Blob([svgString], {type: "image/svg+xml;charset=utf-8"});
    const url = URL.createObjectURL(svgBlob);

    img.onload = () => {
      // 余白の中心に描画
      ctx.drawImage(img, offsetX, offsetY, logoSize, logoSize);

      try {
        const pngUrl = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.download = "splash-icon.png"; 
        a.href = pngUrl;
        a.click();
      } catch(e) {
        console.error("ダウンロード失敗", e);
      }
    };
    img.src = url;
  </script>
</body>
</html>
