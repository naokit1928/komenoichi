<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.json" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>こめのいち | 農家から直接、おいしいお米を。</title>
    
    <meta name="description" content="近所の農家から直接お米を予約・購入できるプラットフォーム「こめのいち」。スマホで事前予約して、あとは近くの農園へ受け取りに行くだけ！" />
    
    <meta property="og:title" content="こめのいち | 農家から直接、おいしいお米を。" />
    <meta property="og:description" content="近所の農家から直接お米を予約・購入できるプラットフォーム「こめのいち」。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://komenoichi.jp/" />
    <meta property="og:image" content="https://komenoichi.jp/apple-touch-icon.png" />
    <meta property="og:site_name" content="こめのいち" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        background-color: #ffffff !important;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        width: 100%;
      }
      
      #root {
        overflow-x: hidden;
        width: 100%;
      }

      /* スプラッシュスクリーンの魔法 */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-bottom: 12vh;
        z-index: 9999;
        /* アニメーションはそのまま */
        animation: fadeOutSplash 0.4s ease-in-out 1.2s forwards;
      }

      #splash-screen img {
        width: 110px;
        height: auto;
        animation: popInLogo 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes fadeOutSplash {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      @keyframes popInLogo {
        0% { transform: scale(0.85); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <img src="/logo-mark.svg" alt="こめのいち" />
    </div>

    <script>
      (function() {
        const splash = document.getElementById('splash-screen');
        // ブラウザのセッション（タブを開いてからの記憶）に「見たよ」マークがあるかチェック
        if (sessionStorage.getItem('splashShown')) {
          // すでに見たことがある（更新ボタンなどを押した）場合は、一瞬で非表示にする
          splash.style.display = 'none';
          splash.style.animation = 'none';
        } else {
          // 初めて開いた場合は、「見たよ」マークをつける
          sessionStorage.setItem('splashShown', 'true');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
