<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>こめのいち | 農家から直接、おいしいお米を。</title>
    
    <meta name="description" content="近所の農家から直接お米を予約・購入できるプラットフォーム「こめのいち」。スマホで事前予約して、あとは農家のお宅へ受け取りに行くだけ！" />
    
    <meta property="og:title" content="こめのいち | 農家から直接、おいしいお米を。" />
    <meta property="og:description" content="近所の農家から直接お米を予約・購入できるプラットフォーム「こめのいち」。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://komenoichi.jp/" />
    <meta property="og:image" content="https://komenoichi.jp/apple-touch-icon.png" />
    <meta property="og:site_name" content="こめのいち" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <style>
      /* すべての要素で「余白込み」でサイズ計算させる（ズレの特効薬） */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        background-color: #ffffff !important;
        margin: 0;
        padding: 0;
        overflow-x: hidden; /* 横スクロールをブロック */
        width: 100%; /* 横幅を画面ぴったりに固定 */
      }
      
      #root {
        overflow-x: hidden;
        width: 100%;
      }

      /* ========================================= */
      /* スプラッシュスクリーンの魔法 */
      /* ========================================= */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeOutSplash 0.4s ease-in-out 1.2s forwards;
      }

      #splash-screen img {
        width: 110px;
        height: auto;
        animation: popInLogo 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes fadeOutSplash {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      @keyframes popInLogo {
        0% { transform: scale(0.85); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <img src="/logo-mark.svg" alt="こめのいち" />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
